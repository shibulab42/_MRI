name: researchmap 月次更新

on:
  schedule:
    - cron: '0 0 1 * *'   # 毎月1日 9:00（日本時間）
  workflow_dispatch:       # GitHub の Actions 画面から手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: researchmap から新着論文を取り込む
        run: python update_from_researchmap.py

      - name: data.js を作り直す
        run: python convert_data.py

      - name: 変更があればコミットして公開
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile.txt news.txt data.js researchmap_seen.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "researchmap から新着論文を自動追加"
            git push
          fi
